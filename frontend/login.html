<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Biomédica IMSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/app/css/styles.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg-tarjeta);
            border: 1px solid var(--borde-fino);
            border-radius: 12px;
            overflow: hidden;
        }
        .login-banner {
            background-color: var(--verde-imss);
            color: #FFFFFF;
            padding: 1.75rem 1.5rem;
            text-align: center;
            border-bottom: 3px solid var(--dorado-sutil);
        }
        .nav-tabs-clean {
            border-bottom: 1px solid var(--borde-fino);
            display: flex;
        }
        .nav-tabs-clean button {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.85rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--texto-secundario);
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .nav-tabs-clean button.activo {
            color: var(--verde-imss);
            font-weight: 600;
            border-bottom-color: var(--verde-imss);
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-banner">
        <i class="bi bi-heart-pulse fs-2 mb-2 d-block"></i>
        <h5 class="fw-bold mb-1">Biomédica IMSS</h5>
        <small class="text-white-50" style="font-size: 0.8rem;">Sistema de Gestión e Inventario de Equipo Médico</small>
    </div>

    <div class="nav-tabs-clean">
        <button id="btn-tab-login" class="activo" onclick="mostrarTab('login')">Iniciar Sesión</button>
        <button id="btn-tab-registro" onclick="mostrarTab('registro')">Crear Cuenta</button>
    </div>

    <div class="p-4">
        <div id="alerta-login" class="alert d-none small py-2" role="alert"></div>

        <!-- PANEL 1: INICIAR SESIÓN -->
        <form id="form-login">
            <div class="mb-3">
                <label class="form-label small fw-medium text-muted">Correo electrónico</label>
                <input type="email" class="form-control" id="login-correo" placeholder="nombre@imss.gob.mx" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-medium text-muted">Contraseña</label>
                <div class="password-box">
                    <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                    <button type="button" class="btn-toggle-pass" onclick="alternarPassword('login-password', this)" title="Mostrar u ocultar contraseña">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primario w-100 py-2">
                Entrar al Sistema
            </button>
        </form>

        <!-- PANEL 2: REGISTRO -->
        <form id="form-registro" class="d-none">
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label small text-muted">Primer Nombre *</label>
                    <input type="text" class="form-control" id="reg-nombre1" required>
                </div>
                <div class="col-6">
                    <label class="form-label small text-muted">Segundo Nombre</label>
                    <input type="text" class="form-control" id="reg-nombre2">
                </div>
            </div>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label small text-muted">Primer Apellido *</label>
                    <input type="text" class="form-control" id="reg-apellido1" required>
                </div>
                <div class="col-6">
                    <label class="form-label small text-muted">Segundo Apellido</label>
                    <input type="text" class="form-control" id="reg-apellido2">
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label small text-muted">Nombre de usuario (opcional)</label>
                <input type="text" class="form-control" id="reg-username" placeholder="ej. luis_biomedica">
            </div>
            <div class="mb-2">
                <label class="form-label small text-muted">Correo electrónico *</label>
                <input type="email" class="form-control" id="reg-correo" required>
            </div>
            <div class="mb-4">
                <label class="form-label small text-muted">Contraseña *</label>
                <div class="password-box">
                    <input type="password" class="form-control" id="reg-password" required>
                    <button type="button" class="btn-toggle-pass" onclick="alternarPassword('reg-password', this)" title="Mostrar u ocultar contraseña">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primario w-100 py-2">
                Registrar Cuenta
            </button>
        </form>
    </div>
</div>

<script>
    const alerta = document.getElementById("alerta-login");

    // Función limpia para mostrar/ocultar contraseña sin que el icono desaparezca nunca
    function alternarPassword(idInput, boton) {
        const input = document.getElementById(idInput);
        const icono = boton.querySelector("i");
        if (input.type === "password") {
            input.type = "text";
            icono.className = "bi bi-eye-slash";
        } else {
            input.type = "password";
            icono.className = "bi bi-eye";
        }
        input.focus(); // Mantiene el cursor dentro del campo listo para seguir escribiendo
    }

    function mostrarAlerta(mensaje, tipo) {
        alerta.textContent = mensaje;
        alerta.className = `alert alert-${tipo} small py-2`;
        alerta.classList.remove("d-none");
    }

    function mostrarTab(tab) {
        alerta.classList.add("d-none");
        if (tab === "login") {
            document.getElementById("form-login").classList.remove("d-none");
            document.getElementById("form-registro").classList.add("d-none");
            document.getElementById("btn-tab-login").classList.add("activo");
            document.getElementById("btn-tab-registro").classList.remove("activo");
        } else {
            document.getElementById("form-login").classList.add("d-none");
            document.getElementById("form-registro").classList.remove("d-none");
            document.getElementById("btn-tab-login").classList.remove("activo");
            document.getElementById("btn-tab-registro").classList.add("activo");
        }
    }

    document.getElementById("form-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const datos = {
            correo: document.getElementById("login-correo").value,
            password: document.getElementById("login-password").value
        };

        try {
            const res = await fetch("/usuarios/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });
            const data = await res.json();

            if (!res.ok) {
                mostrarAlerta(data.detail || "Correo o contraseña incorrectos.", "danger");
                return;
            }

            localStorage.setItem("usuario_imss", JSON.stringify(data.usuario));
            mostrarAlerta(`Bienvenido, ${data.usuario.primernombre}. Entrando...`, "success");
            setTimeout(() => { window.location.href = "/app/dashboard.html"; }, 700);
        } catch (err) {
            mostrarAlerta("Error de conexión con el servidor.", "danger");
        }
    });

    document.getElementById("form-registro").addEventListener("submit", async (e) => {
        e.preventDefault();
        const datos = {
            primernombre: document.getElementById("reg-nombre1").value,
            segundonombre: document.getElementById("reg-nombre2").value || null,
            primerapellido: document.getElementById("reg-apellido1").value,
            segundoapellido: document.getElementById("reg-apellido2").value || null,
            username: document.getElementById("reg-username").value || null,
            correo: document.getElementById("reg-correo").value,
            password: document.getElementById("reg-password").value
        };

        try {
            const res = await fetch("/usuarios/registro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });
            const data = await res.json();

            if (!res.ok) {
                mostrarAlerta(data.detail || "No se pudo crear la cuenta.", "danger");
                return;
            }

            document.getElementById("form-registro").reset();
            mostrarTab("login");
            mostrarAlerta("Cuenta creada con rol EMPLEADO. Ya puedes iniciar sesión.", "success");
        } catch (err) {
            mostrarAlerta("Error de conexión con el servidor.", "danger");
        }
    });
</script>

</body>
</html>
