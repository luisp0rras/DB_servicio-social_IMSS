<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Biomédica IMSS</title>
    <!-- Bootstrap 5 e Iconos Institucionales -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Hoja de estilos minimalista institucional -->
    <link rel="stylesheet" href="/app/css/styles.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg-tarjeta);
            border: 1px solid var(--borde-fino);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
        }
        .login-banner {
            background-color: var(--verde-imss);
            color: #FFFFFF;
            padding: 1.75rem 1.5rem;
            text-align: center;
            border-bottom: 3px solid var(--dorado-sutil);
        }
        .nav-tabs-clean {
            border-bottom: 1px solid var(--borde-fino);
            display: flex;
        }
        .nav-tabs-clean button {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.85rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--texto-secundario);
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .nav-tabs-clean button.activo {
            color: var(--verde-imss);
            font-weight: 600;
            border-bottom-color: var(--verde-imss);
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <!-- Encabezado Institucional IMSS -->
    <div class="login-banner">
        <i class="bi bi-heart-pulse fs-2 mb-2 d-block"></i>
        <h5 class="fw-bold mb-1">Biomédica IMSS</h5>
        <small class="text-white-50" style="font-size: 0.8rem;">Sistema de Gestión e Inventario de Equipo Médico</small>
    </div>

    <!-- Pestañas de navegación (Login / Registro) -->
    <div class="nav-tabs-clean" id="barra-tabs-acceso">
        <button id="btn-tab-login" class="activo" onclick="mostrarTab('login')">Iniciar Sesión</button>
        <button id="btn-tab-registro" onclick="mostrarTab('registro')">Crear Cuenta</button>
    </div>

    <div class="p-4">
        <!-- Alerta dinámica para mensajes de éxito o error -->
        <div id="alerta-login" class="alert d-none small py-2" role="alert"></div>

        <!-- ======================================================
             PANEL 1: INICIAR SESIÓN
             ====================================================== -->
        <form id="form-login">
            <div class="mb-3">
                <label class="form-label small fw-medium text-muted">Correo electrónico</label>
                <input type="email" class="form-control" id="login-correo" placeholder="nombre@imss.gob.mx" autocomplete="email" required>
            </div>
            <div class="mb-2">
                <label class="form-label small fw-medium text-muted">Contraseña</label>
                <div class="password-box">
                    <input type="password" class="form-control" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" class="btn-toggle-pass" onclick="alternarPassword('login-password', this)" title="Mostrar u ocultar contraseña">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <div class="text-end mb-4">
                <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none small" 
                        style="color: var(--verde-acento);" onclick="mostrarTab('recuperar')">
                    ¿Olvidaste tu contraseña?
                </button>
            </div>
            <button type="submit" class="btn btn-primario w-100 py-2" id="btn-submit-login">
                Entrar al Sistema
            </button>
        </form>

        <!-- ======================================================
             PANEL 2: REGISTRO DE NUEVO USUARIO
             ====================================================== -->
        <form id="form-registro" class="d-none">
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label small text-muted">Primer Nombre *</label>
                    <input type="text" class="form-control" id="reg-nombre1" maxlength="20" required>
                </div>
                <div class="col-6">
                    <label class="form-label small text-muted">Segundo Nombre</label>
                    <input type="text" class="form-control" id="reg-nombre2" maxlength="20">
                </div>
            </div>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label small text-muted">Primer Apellido *</label>
                    <input type="text" class="form-control" id="reg-apellido1" maxlength="30" required>
                </div>
                <div class="col-6">
                    <label class="form-label small text-muted">Segundo Apellido</label>
                    <input type="text" class="form-control" id="reg-apellido2" maxlength="30">
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label small text-muted">Nombre de usuario (opcional)</label>
                <input type="text" class="form-control" id="reg-username" maxlength="50" placeholder="ej. luis_biomedica">
            </div>
            <div class="mb-2">
                <label class="form-label small text-muted">Correo electrónico *</label>
                <input type="email" class="form-control" id="reg-correo" required>
            </div>
            <div class="mb-4">
                <label class="form-label small text-muted">Contraseña *</label>
                <div class="password-box">
                    <input type="password" class="form-control" id="reg-password" minlength="4" required>
                    <button type="button" class="btn-toggle-pass" onclick="alternarPassword('reg-password', this)" title="Mostrar u ocultar contraseña">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primario w-100 py-2" id="btn-submit-registro">
                Registrar Cuenta
            </button>
        </form>

        <!-- ======================================================
             PANEL 3: RECUPERACIÓN DE CONTRASEÑA (CÓDIGO OTP 6 DÍGITOS)
             ====================================================== -->
        <div id="panel-recuperar" class="d-none">
            <h6 class="fw-bold mb-1">Restablecer Contraseña</h6>
            <p class="text-muted small mb-3">Te enviaremos un código de verificación de 6 dígitos a tu correo registrado.</p>

            <!-- Paso 1 de recuperación: Solicitar código al correo -->
            <form id="form-solicitar-codigo">
                <div class="mb-3">
                    <label class="form-label small fw-medium text-muted">Correo electrónico registrado</label>
                    <input type="email" class="form-control" id="rec-correo" placeholder="tu_correo@ejemplo.com" required>
                </div>
                <button type="submit" class="btn btn-primario w-100 py-2 mb-2" id="btn-enviar-codigo">
                    Enviar Código al Correo
                </button>
            </form>

            <!-- Paso 2 de recuperación: Validar código OTP y asignar nueva contraseña -->
            <form id="form-confirmar-codigo" class="d-none">
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label small fw-medium text-muted mb-1">Código de 6 dígitos recibido</label>
                        <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none" 
                                style="font-size: 0.75rem; color: var(--verde-acento);" onclick="reiniciarPasoRecuperacion()">
                            Cambiar correo / Reenviar
                        </button>
                    </div>
                    <input type="text" class="form-control text-center fw-bold" id="rec-codigo" 
                           maxlength="6" inputmode="numeric" pattern="[0-9]{6}" placeholder="123456" 
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-medium text-muted">Nueva Contraseña</label>
                    <div class="password-box">
                        <input type="password" class="form-control" id="rec-nueva-password" minlength="4" placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-pass" onclick="alternarPassword('rec-nueva-password', this)" title="Mostrar u ocultar contraseña">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primario w-100 py-2 mb-2" id="btn-confirmar-codigo">
                    Guardar Nueva Contraseña
                </button>
            </form>

            <button type="button" class="btn btn-secundario w-100 btn-sm mt-1" onclick="mostrarTab('login')">
                <i class="bi bi-arrow-left me-1"></i> Volver al Inicio de Sesión
            </button>
        </div>
    </div>
</div>

<!-- ==========================================================
     LÓGICA DE AUTENTICACIÓN, REGISTRO Y RECUPERACIÓN
     ========================================================== -->
<script>
    // Si el usuario ya tiene una sesión activa en este navegador, redirigir directo al panel principal
    if (localStorage.getItem("usuario_imss")) {
        window.location.href = "/app/dashboard.html";
    }

    const alerta = document.getElementById("alerta-login");

    // Alterna la visibilidad de cualquier campo de contraseña
    function alternarPassword(idInput, boton) {
        const input = document.getElementById(idInput);
        const icono = boton.querySelector("i");
        if (input.type === "password") {
            input.type = "text";
            icono.className = "bi bi-eye-slash";
        } else {
            input.type = "password";
            icono.className = "bi bi-eye";
        }
        input.focus();
    }

    // Muestra un cuadro de notificación estilizado (success, danger, info, warning)
    function mostrarAlerta(mensaje, tipo) {
        alerta.textContent = mensaje;
        alerta.className = `alert alert-${tipo} small py-2`;
        alerta.classList.remove("d-none");
    }

    // Permite regresar al Paso 1 de recuperación si el usuario necesita corregir su correo o reenviar código
    function reiniciarPasoRecuperacion() {
        alerta.classList.add("d-none");
        document.getElementById("form-solicitar-codigo").classList.remove("d-none");
        document.getElementById("form-confirmar-codigo").classList.add("d-none");
        document.getElementById("rec-correo").focus();
    }

    // Cambia entre los 3 paneles: 'login', 'registro' y 'recuperar'
    function mostrarTab(tab) {
        alerta.classList.add("d-none");
        const formLogin = document.getElementById("form-login");
        const formRegistro = document.getElementById("form-registro");
        const panelRecuperar = document.getElementById("panel-recuperar");
        const barraTabs = document.getElementById("barra-tabs-acceso");

        formLogin.classList.add("d-none");
        formRegistro.classList.add("d-none");
        panelRecuperar.classList.add("d-none");

        if (tab === "login") {
            barraTabs.classList.remove("d-none");
            formLogin.classList.remove("d-none");
            document.getElementById("btn-tab-login").classList.add("activo");
            document.getElementById("btn-tab-registro").classList.remove("activo");
        } else if (tab === "registro") {
            barraTabs.classList.remove("d-none");
            formRegistro.classList.remove("d-none");
            document.getElementById("btn-tab-login").classList.remove("activo");
            document.getElementById("btn-tab-registro").classList.add("activo");
        } else if (tab === "recuperar") {
            barraTabs.classList.add("d-none");
            panelRecuperar.classList.remove("d-none");
            document.getElementById("form-solicitar-codigo").classList.remove("d-none");
            document.getElementById("form-confirmar-codigo").classList.add("d-none");

            // Si ya había escrito su correo en Login, copiarlo automáticamente para ahorrarle trabajo
            const correoEscrito = document.getElementById("login-correo").value.trim();
            if (correoEscrito) {
                document.getElementById("rec-correo").value = correoEscrito;
            }
        }
    }

    // 1. Iniciar Sesión (POST /usuarios/login)
    document.getElementById("form-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-submit-login");
        btn.disabled = true;
        btn.textContent = "Verificando...";

        const datos = {
            correo: document.getElementById("login-correo").value.trim(),
            password: document.getElementById("login-password").value
        };

        try {
            const res = await fetch("/usuarios/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });
            const data = await res.json();

            if (!res.ok) {
                mostrarAlerta(data.detail || "Correo o contraseña incorrectos.", "danger");
                btn.disabled = false;
                btn.textContent = "Entrar al Sistema";
                return;
            }

            localStorage.setItem("usuario_imss", JSON.stringify(data.usuario));
            mostrarAlerta(`Bienvenido, ${data.usuario.primernombre}. Entrando...`, "success");
            setTimeout(() => { window.location.href = "/app/dashboard.html"; }, 600);
        } catch (err) {
            mostrarAlerta("Error de conexión con el servidor.", "danger");
            btn.disabled = false;
            btn.textContent = "Entrar al Sistema";
        }
    });

    // 2. Crear Cuenta Nueva (POST /usuarios/registro)
    document.getElementById("form-registro").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-submit-registro");
        btn.disabled = true;
        btn.textContent = "Registrando...";

        const datos = {
            primernombre: document.getElementById("reg-nombre1").value.trim(),
            segundonombre: document.getElementById("reg-nombre2").value.trim() || null,
            primerapellido: document.getElementById("reg-apellido1").value.trim(),
            segundoapellido: document.getElementById("reg-apellido2").value.trim() || null,
            username: document.getElementById("reg-username").value.trim() || null,
            correo: document.getElementById("reg-correo").value.trim(),
            password: document.getElementById("reg-password").value
        };

        try {
            const res = await fetch("/usuarios/registro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });
            const data = await res.json();

            if (!res.ok) {
                mostrarAlerta(data.detail || "No se pudo crear la cuenta.", "danger");
                return;
            }

            document.getElementById("form-registro").reset();
            mostrarTab("login");
            document.getElementById("login-correo").value = datos.correo;
            mostrarAlerta("Cuenta creada con rol EMPLEADO. Ya puedes iniciar sesión.", "success");
        } catch (err) {
            mostrarAlerta("Error de conexión con el servidor.", "danger");
        } finally {
            btn.disabled = false;
            btn.textContent = "Registrar Cuenta";
        }
    });

    // 3. Recuperar Contraseña - Paso 1: Solicitar Código OTP por Correo
    document.getElementById("form-solicitar-codigo").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-enviar-codigo");
        btn.disabled = true;
        btn.textContent = "Enviando código...";

        const correo = document.getElementById("rec-correo").value.trim();
        try {
            const res = await fetch("/usuarios/recuperar-password/solicitar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ correo })
            });
            const data = await res.json();

            if (!res.ok) {
                mostrarAlerta(data.detail || "No se pudo enviar el código.", "danger");
            } else {
                mostrarAlerta(data.mensaje, "success");
                document.getElementById("form-solicitar-codigo").classList.add("d-none");
                document.getElementById("form-confirmar-codigo").classList.remove("d-none");
                document.getElementById("rec-codigo").focus();
            }
        } catch (err) {
            mostrarAlerta("Error de conexión con el servidor.", "danger");
        } finally {
            btn.disabled = false;
            btn.textContent = "Enviar Código al Correo";
        }
    });

    // 4. Recuperar Contraseña - Paso 2: Confirmar Código OTP y Guardar Nueva Contraseña
    document.getElementById("form-confirmar-codigo").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btn-confirmar-codigo");
        btn.disabled = true;
        btn.textContent = "Guardando...";

        const datos = {
            correo: document.getElementById("rec-correo").value.trim(),
            codigo: document.getElementById("rec-codigo").value.trim(),
            nueva_password: document.getElementById("rec-nueva-password").value
        };

        try {
            const res = await fetch("/usuarios/recuperar-password/confirmar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });
            const data = await res.json();

            if (!res.ok) {
                mostrarAlerta(data.detail || "Código inválido o expirado.", "danger");
                return;
            }

            document.getElementById("form-solicitar-codigo").reset();
            document.getElementById("form-confirmar-codigo").reset();
            mostrarTab("login");
            document.getElementById("login-correo").value = datos.correo;
            mostrarAlerta(data.mensaje, "success");
        } catch (err) {
            mostrarAlerta("Error de conexión con el servidor.", "danger");
        } finally {
            btn.disabled = false;
            btn.textContent = "Guardar Nueva Contraseña";
        }
    });
</script>

</body>
</html>
